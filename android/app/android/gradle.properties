org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9's built-in Kotlin compiles the Kotlin sources (no KGP is applied). The version is pinned
# to the `org.jetbrains.kotlin.android` entry marked `apply false` in settings.gradle.kts, which
# only puts KGP 2.4.20 on the build classpath so AGP's bundled compiler is not used (Flutter
# rejects Kotlin older than its supported range). Both flags are stated explicitly on purpose:
# the Flutter tool appends `android.builtInKotlin=false` / `android.newDsl=false` to this file on
# every build when the property is missing.
android.builtInKotlin=true
android.newDsl=true
