org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Both flags below are the Flutter 3.47 template defaults and AGP reports them as
# deprecated ("removed in AGP 10"), but they cannot be dropped yet:
#  - android.newDsl=true makes the Flutter Gradle plugin fail while applying
#    (it casts the extension to the pre-AGP-9 AbstractAppExtension).
#  - android.builtInKotlin=true compiles with AGP 9.1's bundled Kotlin 2.2.10,
#    below Flutter's minimum of 2.2.20, so the project keeps KGP 2.4.0 instead.
# AGP is also capped at 9.1.0: 9.2 needs Gradle 9.4.1 while Flutter supports 9.3.1.
android.newDsl=false
android.builtInKotlin=false
