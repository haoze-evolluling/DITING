name: diting_shared
description: "谛听 DITING shared Flutter UI: theme, design system, l10n and the prefs/db shims both apps use."
publish_to: 'none'
version: 2.7.0+20700

environment:
  sdk: ^3.14.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Design system dependencies.
  material_ui: ^1.11.0                   # Material3 widgets (superellipse, Easing)
  material_color_utilities: ^0.13.0      # HCT / DynamicColor (Flutter SDK pins 0.13.0)
  material_new_shapes: ^1.0.0            # Morph / toPath (material_ui 1.8 does not export them)
  animations: ^3.0.0                     # FadeThrough / OpenContainer
  path_parsing: ^1.1.0                   # Parses the few brand SVGs Tabler does not ship
  collection: ^1.19.1
  flutter_tabler_icons: ^1.43.0            # The one icon set used across the app

  # Lazily-built list that keeps a far jump (scrollbar drag) at O(1) per row by
  # estimating unlaid rows, as FlClash's vendored prism_ui list does.
  super_sliver_list: ^0.4.1

  flutter_riverpod: ^3.5.0
  go_router: ^18.1.1

  # The legacy database reader shared by both hosts.
  sqflite: ^2.4.5
  path: ^1.9.1

  # Localization: gen-l10n reads lib/l10n/*.arb (see l10n.yaml).
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Localizations are checked in under lib/l10n and regenerated only with
  # `python tool/i18n/gen_l10n.py` (see l10n.yaml). Keep `generate` off: with it
  # on, every `flutter pub get` reruns gen-l10n and rewrites those files with
  # the doc comments the script strips.
  assets:
    - assets/https_passthrough.txt
    # Brand icon drawn on the about page hero and the login gate.
    - assets/images/
    # Payment QR codes for the sponsor page. The member list and avatars are not
    # bundled; they are fetched as recognition_members.json plus avatars/.
    - assets/pay/
  shaders:
    - shaders/liquid_glass.frag
