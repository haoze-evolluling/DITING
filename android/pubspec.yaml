# Pub workspace root: one lockfile for the shared package and the Android app.
#
#   cd android                      # workspace root
#   flutter pub get                 # resolve everything
#   flutter analyze                 # analyze from the workspace root
#   cd app && flutter test          # Android suites
#
# Tests run per package, not from the workspace root: `flutter_tools` resolves
# native-asset hooks and the test asset bundle against the *current* package's
# dependency graph, so a root-level `flutter test app` compiles no hooks (every
# sqflite test then dies on `sqlite3_initialize`) and cannot load
# `packages/diting_shared/...` assets. See `docs/development/`
# `android-build-environment.md`.
#
# Only Android ships a Flutter UI, so the whole Flutter workspace lives under
# android/: the platform app in app/, shared UI, theme, l10n and data shims in
# shared/. Each package only depends on what it actually imports.
name: diting_workspace
publish_to: none

environment:
  sdk: ^3.14.0

workspace:
  - shared
  - app

# Native-asset hook configuration is workspace-wide: pub reads `user_defines`
# from the workspace root, not from an individual member package. The sqlite3
# hook downloads precompiled binaries from GitHub releases, which is unreachable
# from this network, so route it through the mirror.
hooks:
  user_defines:
    sqlite3:
      url_pattern: "https://gh-proxy.com/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"
