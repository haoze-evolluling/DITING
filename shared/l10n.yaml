# Flutter gen-l10n configuration for the shared package. Run
# `python tool/i18n/gen_l10n.py` in shared to regenerate lib/l10n/app_localizations*.dart:
# it also strips the `///` comments gen-l10n emits for every message, which would otherwise
# add tens of thousands of lines of churn to the checked-in generated files. test/l10n/
# guards against running `flutter gen-l10n` directly.
#
# Adding a language: create lib/l10n/app_<code>.arb and add its Locale to AppLanguageMode
# (lib/state/settings_providers.dart). `AppL10n.supportedLocales` is generated from the ARB
# files, so nothing else has to list them.
arb-dir: lib/l10n
template-arb-file: app_zh.arb
output-localization-file: app_localizations.dart
output-class: AppL10n
nullable-getter: false
# Chinese is the fallback language on purpose: `MaterialApp.locale == null` ("follow system")
# resolves through `basicLocaleListResolution`, whose last resort is `supportedLocales.first`.
# That branch is taken when the device reports no locale yet, an unknown one, or a language the
# app ships no resources for, and the product rule is that those show Chinese — see
# `languageInterfaceFooter` in app_zh.arb ("非中文或英文的系统显示中文"). Without this option
# gen-l10n sorts the list alphabetically (en, zh) and every such device gets English instead.
preferred-supported-locales:
  - zh
# The SDK's gen-l10n template still imports `package:flutter_localizations`, whose
# Global{Material,Cupertino}Localizations are deprecated in Flutter 3.50. The generated files
# only ignore `type=lint`, so add a deprecation ignore until the template itself migrates.
header: "// ignore_for_file: deprecated_member_use"
