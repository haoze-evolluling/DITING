# Flutter gen-l10n configuration for the shared package. Run `flutter gen-l10n`
# in packages/diting_shared to regenerate lib/l10n/app_localizations*.dart.
#
# Adding a language: create lib/l10n/app_<code>.arb, add the Locale to AppLanguageMode
# (lib/state/settings_providers.dart) and to the `supportedLocales` list it exposes.
arb-dir: lib/l10n
template-arb-file: app_zh.arb
output-localization-file: app_localizations.dart
output-class: AppL10n
nullable-getter: false
