# Pub workspace root: one lockfile for the shared package and the two apps.
#
#   flutter pub get                     # resolve everything
#   flutter analyze                     # analyze from the root
#   flutter test apps/diting_android    # Android suites
#   flutter test apps/diting_desktop    # desktop suites
#
# Platform projects live in apps/; shared UI, theme, l10n and data shims live in
# packages/diting_shared. Each app only depends on what it actually imports.
name: diting_workspace
publish_to: none

environment:
  sdk: ^3.13.5

workspace:
  - packages/diting_shared
  - apps/diting_android
  - apps/diting_desktop
