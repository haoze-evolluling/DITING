publish_to: 'none'
version: 2.2.9+20209

environment:
  sdk: ^3.13.5

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  diting_shared:
    path: ../../shared

  material_ui: 1.8.0
  flutter_riverpod: 3.4.3
  go_router: ^18.1.1
  http: ^1.6.0
  web_socket_channel: 3.0.3
  qr: 4.0.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
