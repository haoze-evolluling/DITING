[package]
name = "diting-desktop-sqlite"
version = "0.1.0"
edition = "2021"
description = "SQLite persistence backend for the DITING desktop service"
publish = false

[dependencies]
diting-desktop-api = { path = "../diting-desktop-api" }
diting-desktop-app = { path = "../diting-desktop-app" }
diting-desktop-core = { path = "../diting-desktop-core" }
diting-desktop-ipc = { path = "../diting-desktop-ipc" }
diting-desktop-platform = { path = "../diting-desktop-platform" }
diting-dns-cache-core = { path = "../diting-dns-cache-core" }

rusqlite = { version = "0.36", features = ["bundled"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
diting-dns-wire = { path = "../diting-dns-wire" }
