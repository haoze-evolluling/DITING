[package]
name = "diting-vpn-config-core"
version = "0.1.0"
edition = "2021"
description = "TUN route plans and start-configuration defaults for the Android VPN services"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Kotlin is the only caller: the plan crosses JNI as one JSON document.
jni = "0.21"
serde_json = "1"
