[package]
name = "diting-event-core"
version = "0.1.0"
edition = "2021"
description = "Frozen event-envelope schema (state_changed) and JNI builder for the Android automations"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Kotlin is the only caller: it builds the STATE_CHANGED envelope over JNI.
jni = "0.21"
serde_json = "1"
