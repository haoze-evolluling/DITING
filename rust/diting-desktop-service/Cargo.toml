[package]
name = "diting-desktop-service"
version = "0.1.0"
edition = "2021"
description = "The DITING desktop privileged service (pure Rust replacement for the Go service)"
publish = false

[[bin]]
name = "diting-service"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
diting-desktop-api = { path = "../diting-desktop-api" }
diting-desktop-app = { path = "../diting-desktop-app" }
diting-desktop-core = { path = "../diting-desktop-core" }
diting-desktop-dns = { path = "../diting-desktop-dns" }
diting-desktop-ipc = { path = "../diting-desktop-ipc" }
diting-desktop-platform = { path = "../diting-desktop-platform" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util", "macros", "signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
