[package]
name = "diting-desktop-platform"
version = "0.1.0"
edition = "2021"
description = "Windows and Linux platform operations of the DITING desktop Rust service"
publish = false

[dependencies]
diting-desktop-api = { path = "../diting-desktop-api" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util", "macros", "process"] }
thiserror = "1"
async-trait = "0.1"
regex = "1"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Registry", "Win32_System_Services", "Win32_Security", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
windows-service = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
