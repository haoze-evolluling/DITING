[package]
name = "diting-desktop-dns"
version = "0.1.0"
edition = "2021"
description = "DNS listeners and the filter pipeline of the DITING desktop Rust service"
publish = false

[dependencies]
diting-desktop-api = { path = "../diting-desktop-api" }
diting-desktop-core = { path = "../diting-desktop-core" }
diting-dns-wire = { path = "../diting-dns-wire" }
diting-dns-core = { path = "../diting-dns-core" }
diting-dns64-core = { path = "../diting-dns64-core" }
diting-rewrite-core = { path = "../diting-rewrite-core" }
diting-safebrowsing-core = { path = "../diting-safebrowsing-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util", "macros"] }
async-trait = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
http-body-util = "0.1"
base64 = "0.23"
futures-util = "0.3"

