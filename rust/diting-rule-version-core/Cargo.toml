[package]
name = "diting-rule-version-core"
version = "0.1.0"
edition = "2021"
description = "Subscription rule-version governance: line diff between two rule sets and a bounded, de-duplicated version history for diff / rollback (R6 / K8)"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# The request/answer crosses the dart:ffi boundary as JSON, matching the other UI-side kernels.
serde_json = "1"
