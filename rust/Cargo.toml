[workspace]
members = [
    "diting-go-compat",
    "diting-rule-core",
    "diting-policy-core",
    "diting-dns-cache-core",
    "diting-mitm-core",
    "diting-stamp-core",
    "diting-filter-core",
    "diting-rewrite-core",
    "diting-safebrowsing-core",
]
resolver = "2"

# The crates are delivered as shared libraries inside the APK, so strip symbols and let the linker
# do a cheap thin-LTO pass: the artifacts are bundled, not debugged.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
