[workspace]
members = [
    "diting-go-compat",
    "diting-rule-core",
    "diting-policy-core",
    "diting-dns-cache-core",
    "diting-mitm-core",
    "diting-stamp-core",
    "diting-filter-core",
    "diting-rewrite-core",
    "diting-safebrowsing-core",
    "diting-hosts-core",
    "diting-dns64-core",
    "diting-cosmetic-core",
    "diting-resolver-core",
    "diting-dns-core",
    "diting-sniffer-core",
    "diting-bootstrap-core",
    "diting-allowlist-core",
    "diting-connlog-core",
    "diting-ipcache-core",
    "diting-ratelimit-core",
    "diting-proxy-core",
    "diting-cert-core",
]
resolver = "2"

# The crates are delivered as shared libraries inside the APK, so strip symbols and let the linker
# do a cheap thin-LTO pass: the artifacts are bundled, not debugged.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
