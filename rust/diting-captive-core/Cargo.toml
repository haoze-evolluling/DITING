[package]
name = "diting-captive-core"
version = "0.1.0"
edition = "2021"
description = "Captive-portal evaluator: parses the RFC 8910 Captive-Portal option and judges a generate_204 probe into open / portal / unknown, so blocking can be paused while a login portal is up (N6 / K6)"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# The request/answer crosses the dart:ffi boundary as JSON, matching the other UI-side kernels.
serde_json = "1"
