[package]
name = "diting-agent-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# Base64 for the legacy `KeyObfuscator` ciphertext: an upgrade install must decrypt keys the 1.4.3
# build sealed, so the alphabet and padding rules are fixed.
base64 = "0.22"
# OpenAI-compatible request/response bodies (`chat/completions`, `models`) and the pasted JSON
# config: the shapes the app accepts are the parser's job, not the HTTP client's.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The paste recogniser's four steps and the `AS<n>` extraction are the 1.4.3 patterns; keeping the
# source identical is cheaper than re-deriving the token order.
regex = "1"
