[package]
name = "diting-rule-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The snapshot document is decoded by this kernel in production; the test parses it with the same
# model so a field rename on either side fails here.
diting-policy-core = { path = "../diting-policy-core" }
