[package]
name = "diting-notification-core"
version = "0.1.0"
edition = "2021"
description = "Foreground-notification settings and detail-line formatting for the Android services"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Kotlin is the only caller: settings, labels and the composed line cross JNI.
jni = "0.21"
serde_json = "1"
