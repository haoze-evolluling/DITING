[package]
name = "diting-desktop-ipc"
version = "0.1.0"
edition = "2021"
description = "HTTP and WebSocket management API of the DITING desktop Rust service"
publish = false

[dependencies]
diting-desktop-api = { path = "../diting-desktop-api" }
diting-desktop-app = { path = "../diting-desktop-app" }
diting-desktop-core = { path = "../diting-desktop-core" }
diting-desktop-dns = { path = "../diting-desktop-dns" }
diting-desktop-platform = { path = "../diting-desktop-platform" }
diting-services-core = { path = "../diting-services-core" }
diting-stamp-core = { path = "../diting-stamp-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util", "macros", "fs"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
http-body-util = "0.1"
tokio-tungstenite = "0.28"
futures-util = "0.3"
sha2 = "0.10"
rand = "0.10"
base64 = "0.22"
chrono = "0.4"
sha1 = "0.10"
mime_guess = "2"
