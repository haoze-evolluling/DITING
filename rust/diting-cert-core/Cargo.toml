[package]
name = "diting-cert-core"
version = "0.1.0"
edition = "2021"
description = "MITM certificate authority for the Android tunnel engine: root CA lifecycle, leaf minting and the EV trust table"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
base64 = "0.23"
const-oid = { version = "0.10", features = ["db"] }
der = { version = "0.8", features = ["pem", "std"] }
ecdsa = { version = "0.17", features = ["der"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem", "std"] }
rand = "0.10"
sec1 = { version = "0.8", features = ["der"] }
sha2 = { version = "0.11", features = ["oid"] }
x509-cert = { version = "0.3", features = ["builder", "hazmat"] }
