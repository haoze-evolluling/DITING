[package]
name = "diting-cert-core"
version = "0.1.0"
edition = "2021"
description = "MITM certificate authority for the Android tunnel engine: root CA lifecycle, leaf minting and the EV trust table"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
base64 = "0.22"
const-oid = { version = "0.9", features = ["db"] }
der = { version = "0.7", features = ["pem", "std"] }
ecdsa = { version = "0.16", features = ["der", "signing"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sec1 = { version = "0.7", features = ["der"] }
sha2 = { version = "0.10", features = ["oid"] }
x509-cert = { version = "0.2.5", features = ["builder", "hazmat"] }
