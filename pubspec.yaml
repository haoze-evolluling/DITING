# Pub workspace root: one lockfile for the shared package and the two apps.
#
#   flutter pub get              # resolve everything
#   flutter analyze              # analyze from the root
#   flutter test android/app     # Android suites
#   flutter test desktop/app     # desktop suites
#
# Platform apps live in android/app and desktop/app; shared UI, theme, l10n and
# data shims live in shared. Each app only depends on what it actually imports.
name: diting_workspace
publish_to: none

environment:
  sdk: ^3.13.5

workspace:
  - shared
  - android/app
  - desktop/app

# Native-asset hook configuration is workspace-wide: pub reads `user_defines`
# from the workspace root, not from an individual member package. The sqlite3
# hook downloads precompiled binaries from GitHub releases, which is unreachable
# from this network, so route it through the mirror.
hooks:
  user_defines:
    sqlite3:
      url_pattern: "https://gh-proxy.com/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"
